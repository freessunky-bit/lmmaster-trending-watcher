name: trending-watcher cron

# 6시간마다 실행 — ADR-0059 §1.
# manual dispatch (workflow_dispatch)로 dry-run 가능.

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true이면 fetch만 + Issue 생성 X"
        required: false
        default: "false"

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

      - name: Run trending-watcher
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: cargo run --release --bin trending-watcher

      - name: Set GENERATED_AT env
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: echo "GENERATED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_ENV

      - name: Create review issue (큐레이터 알림)
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: JasonEtco/create-an-issue@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GENERATED_AT: ${{ env.GENERATED_AT }}
        with:
          filename: report.md
          update_existing: true
          search_existing: open
